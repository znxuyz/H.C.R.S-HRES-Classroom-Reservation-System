<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教室借用系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="m9 15 2 2 4-4"/>
        </svg>
      </span>
      <span class="brand-text"><span id="siteTitle">教室借用系統</span><small>Classroom Reservation</small></span>
    </a>
    <nav class="tabs" id="tabs">
      <button data-tab="calendar" class="active">借用狀況</button>
      <button data-tab="apply">申請借用</button>
      <button data-tab="mine">我的申請</button>
      <button type="button" id="helpBtn" data-no-tab>操作說明</button>
    </nav>
    <a href="admin.html" id="adminLink" class="btn ghost admin-btn" hidden>管理後台</a>
    <div class="user" id="userBox"></div>
  </header>
  <script>
    // 不等主程式載入，立刻依上次登入的身分顯示「管理後台」按鈕與帳號，避免換頁時閃一下
    // （身分記錄由 js/common.js 寫入，登入狀態確認後會再校正）
    (function () {
      try {
        var u = JSON.parse(localStorage.getItem("hcrs-user"));
        if (!u || !u.email) return;
        var link = document.getElementById("adminLink");
        if (link && (u.role === "admin" || u.role === "supervisor")) link.hidden = false;
        var who = document.createElement("span");
        who.className = "who";
        who.textContent = u.name;
        var badge = document.createElement("small");
        badge.textContent = { admin: "管理員", supervisor: "主管" }[u.role] || "教師";
        who.appendChild(badge);
        var logout = document.createElement("button");
        logout.className = "btn ghost";
        logout.textContent = "登出";
        document.getElementById("userBox").replaceChildren(who, logout);
      } catch (e) { /* 沒有記錄就照原本流程 */ }
    })();
  </script>

  <main>
    <!-- 公開借用狀況 -->
    <section id="tab-calendar" class="tab active">
      <div class="toolbar">
        <button class="btn ghost" id="prevMonth" aria-label="上個月">‹</button>
        <h2 id="monthLabel"></h2>
        <button class="btn ghost" id="nextMonth" aria-label="下個月">›</button>
        <button class="btn ghost" id="thisMonth">本月</button>
        <span class="spacer"></span>
        <label>教室 <select id="roomFilter"></select></label>
      </div>
      <div id="roomLegend" class="legend"></div>
      <div id="calendar" class="calendar"></div>
      <p class="hint">僅顯示已核准的借用。點選日期可查看當天各教室、各節次的借用情形。</p>
    </section>

    <!-- 申請借用 -->
    <section id="tab-apply" class="tab">
      <div class="card need-login">請先登入（限 <span class="domain-text"></span> 帳號）後再申請借用。</div>
      <form id="applyForm" class="card form" hidden>
        <h2>申請借用教室</h2>

        <label class="field">教室
          <select id="fRoom" required></select>
        </label>

        <fieldset class="field">
          <legend>借用方式</legend>
          <label class="inline"><input type="radio" name="type" value="once" checked> 只借一次</label>
          <label class="inline"><input type="radio" name="type" value="weekly"> 每週固定</label>
          <label class="inline"><input type="radio" name="type" value="monthly"> 每月固定</label>
        </fieldset>

        <div data-for="once">
          <label class="field">日期 <input type="date" id="fDate"></label>
        </div>

        <div data-for="weekly" hidden>
          <fieldset class="field">
            <legend>每週星期</legend>
            <div class="checks" id="fWeekdays"></div>
          </fieldset>
        </div>

        <div data-for="monthly" hidden>
          <fieldset class="field">
            <legend>每月日期</legend>
            <div class="checks days" id="fMonthDays"></div>
          </fieldset>
        </div>

        <div data-for="weekly monthly" hidden class="row">
          <label class="field">開始日期 <input type="date" id="fStart"></label>
          <label class="field">結束日期 <input type="date" id="fEnd"></label>
        </div>

        <fieldset class="field">
          <legend>節次</legend>
          <div class="quick-periods">
            <span class="muted">快速選擇：</span>
            <button type="button" class="btn small ghost" data-quick="all">整天</button>
            <button type="button" class="btn small ghost" data-quick="am">上午</button>
            <button type="button" class="btn small ghost" data-quick="pm">下午</button>
            <button type="button" class="btn small ghost" data-quick="none">清除</button>
          </div>
          <div class="checks" id="fPeriods"></div>
        </fieldset>

        <div class="row">
          <label class="field">教師姓名
            <input type="text" id="fTeacher" maxlength="30" placeholder="實際使用教室的教師">
          </label>
          <label class="field">班級
            <input type="text" id="fClass" maxlength="30" placeholder="例：三年二班">
          </label>
        </div>
        <div class="row">
          <label class="field">課程
            <input type="text" id="fCourse" maxlength="50" placeholder="例：自然">
          </label>
          <label class="field">用途
            <input type="text" id="fPurpose" maxlength="100" placeholder="例：實驗課、社團、研習">
          </label>
        </div>
        <p class="hint">教師姓名、班級、課程、用途、備註皆為選填。</p>
        <label class="field">備註
          <textarea id="fNote" rows="2" maxlength="300"></textarea>
        </label>

        <label class="inline manager-only" hidden>
          <input type="checkbox" id="fAutoApprove"> 直接核准（管理員／主管專用，不寄審核信）
        </label>

        <div id="applyPreview" class="hint"></div>
        <div class="actions">
          <button type="submit" class="btn" id="applySubmit">送出申請</button>
        </div>
      </form>
    </section>

    <!-- 我的申請 -->
    <section id="tab-mine" class="tab">
      <div class="card need-login">請先登入以查看您的申請紀錄。</div>
      <div id="mineList" class="list"></div>
    </section>
  </main>

  <dialog id="dayDialog">
    <div class="dialog-head">
      <h3 id="dayTitle"></h3>
      <button class="btn ghost" id="dayClose" aria-label="關閉">✕</button>
    </div>
    <div id="dayBody" class="table-wrap"></div>
  </dialog>

  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
